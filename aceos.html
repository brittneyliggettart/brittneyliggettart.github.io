<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Animated ACEOs — Brittney Liggett Art" />
  <title>Animated ACEOs — Brittney Liggett Art</title>

  <style>
    :root{
      --bg1:#0b0f2a;
      --bg2:#1a1150;
      --bg3:#2a0f61;

      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.72);

      --btn:rgba(255,255,255,.09);
      --btnHover:rgba(255,255,255,.14);

      --shadow:0 18px 60px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(1200px 900px at 50% -200px, #4b7bff22 0%, transparent 60%),
        radial-gradient(900px 700px at 10% 10%, #ff4bd822 0%, transparent 55%),
        radial-gradient(900px 700px at 90% 20%, #34d5ff1e 0%, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
      overflow-x:hidden;
    }

    /* Star field — more dots + some larger soft ones */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.85;
      background:
        /* LARGE soft dots */
        radial-gradient(6px 6px at 12% 18%, rgba(255,255,255,.28) 40%, transparent 41%),
        radial-gradient(5px 5px at 82% 24%, rgba(255,255,255,.26) 40%, transparent 41%),
        radial-gradient(5px 5px at 60% 80%, rgba(255,255,255,.22) 40%, transparent 41%),
        radial-gradient(4.5px 4.5px at 30% 72%, rgba(255,255,255,.24) 40%, transparent 41%),

        /* medium dots */
        radial-gradient(3.5px 3.5px at 18% 40%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(3.5px 3.5px at 72% 64%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(3.5px 3.5px at 90% 44%, rgba(255,255,255,.50) 40%, transparent 41%),

        /* lots of small pinpricks */
        radial-gradient(2.2px 2.2px at 8% 10%, rgba(255,255,255,.65) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 16% 28%, rgba(255,255,255,.65) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 24% 54%, rgba(255,255,255,.60) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 34% 18%, rgba(255,255,255,.60) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 42% 40%, rgba(255,255,255,.58) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 48% 72%, rgba(255,255,255,.58) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 56% 12%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 66% 28%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 74% 48%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 78% 70%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 86% 34%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 90% 62%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 30% 90%, rgba(255,255,255,.50) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 62% 88%, rgba(255,255,255,.50) 40%, transparent 41%);
      filter: drop-shadow(0 0 12px rgba(255,255,255,.10));
    }

    .wrap{
      display:flex;
      justify-content:center;
      padding:44px 16px;
    }

    .card{
      width:min(420px,100%);
      background:rgba(255,255,255,.06);
      border-radius:28px;
      padding:28px 18px 22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      /* BORDER REMOVED PER REQUEST */
      border:none;
    }

    .top{
      text-align:center;
      margin-bottom:20px;
    }

    h1{
      margin:0;
      font-size:20px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .sub{
      margin:6px 0 0;
      font-size:14px;
      color:var(--muted);
    }

    .sectionTitle{
      text-align:center;
      margin:18px 0 10px;
      font-weight:700;
      letter-spacing:.2px;
    }

    .gifWrap{
      margin-top:10px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04);
    }

    .gifWrap img{
      width:100%;
      height:auto;
      display:block;
    }

    .callout{
      text-align:center;
      margin:14px 0 8px;
      color:var(--muted);
      font-size:14px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:10px;
    }

    .btn{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px;
      border-radius:18px;
      text-decoration:none;
      color:var(--text);
      background:var(--btn);
      border:1px solid rgba(255,255,255,.18);
      transition:.15s;
    }

    .btn:hover{
      background:var(--btnHover);
      transform:translateY(-1px);
    }

    .left{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:600;
      min-width:0;
    }

    .iconBox{
      width:40px;
      height:40px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.18);
      flex:0 0 auto;
    }

    .iconBox img{
      width:22px;
      height:22px;
      display:block;
    }

    .label{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .arrow{
      opacity:.85;
      flex:0 0 auto;
    }

    .foot{
      text-align:center;
      margin-top:18px;
      font-size:12px;
      color:rgba(255,255,255,.55);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <main class="card">
      <header class="top">
        <h1>Animated ACEOs</h1>
        <p class="sub">Each ACEO comes with a QR code that brings the painting to life</p>
      </header>

      <h2 class="sectionTitle">Don’t Blink, You’ll Miss It</h2>

      <!-- Update the src below if your GIF lives somewhere else -->
      <div class="gifWrap">
        <img src="/assets/aceo-dont-blink.gif" alt="Don't Blink, You'll Miss It — animated ACEO GIF">
      </div>

      <p class="callout">Available on eBay</p>

      <section class="links" aria-label="Shop">
        <a class="btn" href="https://www.ebay.com/usr/brittneyliggettart" target="_blank" rel="noopener">
          <span class="left">
            <span class="iconBox"><img src="assets/icons/ebay.svg" alt=""></span>
            <span class="label">Shop</span>
          </span>
          <span class="arrow">▶</span>
        </a>

        <!-- Optional: add a back button that matches your style -->
        <a class="btn" href="/" aria-label="Back to home">
          <span class="left">
            <span class="iconBox"><img src="assets/icons/home.svg" alt=""></span>
            <span class="label">Back to Home</span>
          </span>
          <span class="arrow">◀</span>
        </a>
      </section>

      <div class="foot">© <span id="year"></span> Brittney Liggett</div>
    </main>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
