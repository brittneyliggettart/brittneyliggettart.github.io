<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message sent — Brittney Liggett Art</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:
        radial-gradient(1200px 900px at 50% -200px, #4b7bff22 0%, transparent 60%),
        radial-gradient(900px 700px at 10% 10%, #ff4bd822 0%, transparent 55%),
        radial-gradient(900px 700px at 90% 20%, #34d5ff1e 0%, transparent 55%),
        linear-gradient(180deg, #0b0f2a, #1a1150, #2a0f61);
      color:rgba(255,255,255,.92);
      padding:44px 16px;
    }

    .card{
      width:min(480px,100%);
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.16);
      border-radius:28px;
      padding:30px 20px;
      text-align:center;
      backdrop-filter:blur(10px);
    }

    h1{
      margin:0 0 10px;
      font-size:20px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    p{
      color:rgba(255,255,255,.7);
      margin-bottom:20px;
    }

    a{
      display:inline-block;
      padding:12px 16px;
      border-radius:16px;
      background:rgba(255,255,255,.12);
      color:rgba(255,255,255,.92);
      text-decoration:none;
      font-weight:700;
      border:1px solid rgba(255,255,255,.18);
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Message Sent</h1>
    <p>Thanks for reaching out — I’ll get back to you soon.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
