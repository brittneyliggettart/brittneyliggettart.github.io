<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Brittney Liggett Art</title>

  <style>
    :root{
      --bg1:#0b0f2a;
      --bg2:#1a1150;
      --bg3:#2a0f61;

      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.72);

      --panel:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.16);

      --btn:rgba(255,255,255,.12);
      --btnHover:rgba(255,255,255,.18);

      --shadow:0 18px 60px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 900px at 50% -200px, #4b7bff22 0%, transparent 60%),
        radial-gradient(900px 700px at 10% 10%, #ff4bd822 0%, transparent 55%),
        radial-gradient(900px 700px at 90% 20%, #34d5ff1e 0%, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
      overflow-x:hidden;
      position:relative;
    }

    /* Make dots always visible (and above the background) */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      opacity:.95;

      background:
        /* a few larger soft dots */
        radial-gradient(7px 7px at 12% 18%, rgba(255,255,255,.25) 45%, transparent 46%),
        radial-gradient(6px 6px at 82% 24%, rgba(255,255,255,.22) 45%, transparent 46%),
        radial-gradient(6px 6px at 60% 80%, rgba(255,255,255,.20) 45%, transparent 46%),
        radial-gradient(5px 5px at 30% 72%, rgba(255,255,255,.22) 45%, transparent 46%),

        /* medium dots */
        radial-gradient(4px 4px at 18% 40%, rgba(255,255,255,.50) 45%, transparent 46%),
        radial-gradient(4px 4px at 72% 64%, rgba(255,255,255,.50) 45%, transparent 46%),
        radial-gradient(4px 4px at 90% 44%, rgba(255,255,255,.45) 45%, transparent 46%),

        /* lots of small pinpricks */
        radial-gradient(2.6px 2.6px at 8% 10%, rgba(255,255,255,.62) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 16% 28%, rgba(255,255,255,.62) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 24% 54%, rgba(255,255,255,.58) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 34% 18%, rgba(255,255,255,.58) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 42% 40%, rgba(255,255,255,.56) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 48% 72%, rgba(255,255,255,.56) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 56% 12%, rgba(255,255,255,.52) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 66% 28%, rgba(255,255,255,.52) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 74% 48%, rgba(255,255,255,.52) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 78% 70%, rgba(255,255,255,.52) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 86% 34%, rgba(255,255,255,.52) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 90% 62%, rgba(255,255,255,.52) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 30% 90%, rgba(255,255,255,.48) 45%, transparent 46%),
        radial-gradient(2.6px 2.6px at 62% 88%, rgba(255,255,255,.48) 45%, transparent 46%);

      filter: drop-shadow(0 0 14px rgba(255,255,255,.12));
    }

    /* Content wrapper matches homepage */
    .wrap{
      position:relative;
      z-index:1; /* keep content above dots */
      display:flex;
      justify-content:center;
      padding:44px 16px;
    }

    /* Match homepage card width exactly */
    .card{
      width:min(420px,100%);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:28px;
      padding:28px 18px 22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }

    .top{
      text-align:center;
      margin-bottom:12px;
    }

    h1{
      margin:0 0 6px;
      font-size:20px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .sub{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    label{
      display:block;
      margin:14px 0 6px;
      font-size:13px;
      color:var(--muted);
    }

    input, textarea{
      width:100%;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:var(--text);
      outline:none;
    }

    textarea{
      min-height:130px;
      resize:vertical;
    }

    .actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:18px;
    }

    button{
      padding:12px 16px;
      border-radius:16px;
      background:var(--btn);
      color:var(--text);
      font-weight:700;
      border:1px solid rgba(255,255,255,.18);
      cursor:pointer;
      transition:.15s;
    }

    button:hover{
      background:var(--btnHover);
      transform:translateY(-1px);
    }

    .back{
      font-size:14px;
      color:var(--muted);
      text-decoration:none;
      border-bottom:1px dashed rgba(255,255,255,.35);
      padding-bottom:2px;
    }

    .note{
      margin-top:14px;
      font-size:12px;
      color:rgba(255,255,255,.55);
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <main class="card">
      <header class="top">
        <h1>Contact Brittney Liggett</h1>
        <p class="sub">Email me for questions & commissions</p>
      </header>

      <form action="https://formspree.io/f/xvzzpdpk" method="POST">
        <label for="name">Name</label>
        <input id="name" name="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="subject">Subject</label>
        <input id="subject" name="subject">

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <input type="text" name="_gotcha" style="display:none">

        <div class="actions">
          <button type="submit">Send message</button>
          <a class="back" href="/">Back to home</a>
        </div>

        
      </form>
    </main>
  </div>
</body>
</html>
