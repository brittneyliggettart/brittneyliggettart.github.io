<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Brittney Liggett Art</title>

  <style>
    :root{
      --bg1:#0b0f2a;
      --bg2:#1a1150;
      --bg3:#2a0f61;
      --panel:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.16);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.7);
      --btn:rgba(255,255,255,.12);
      --btnHover:rgba(255,255,255,.18);
      --shadow:0 18px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 900px at 50% -200px, #4b7bff22 0%, transparent 60%),
        radial-gradient(900px 700px at 10% 10%, #ff4bd822 0%, transparent 55%),
        radial-gradient(900px 700px at 90% 20%, #34d5ff1e 0%, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
      display:flex; justify-content:center;
      padding:44px 16px;
    }
    .card{
      width:min(520px,100%);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:28px;
      padding:26px 18px 20px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }
    h1{
      margin:0 0 6px;
      text-align:center;
      font-size:20px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }
    .sub{
      text-align:center;
      color:var(--muted);
      margin-bottom:18px;
      font-size:14px;
    }
    label{
      display:block;
      margin:14px 0 6px;
      font-size:13px;
      color:var(--muted);
    }
    input, textarea{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:var(--text);
      outline:none;
    }
    textarea{min-height:140px; resize:vertical;}
    .actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:18px;
    }
    button{
      padding:12px 16px;
      border-radius:16px;
      background:var(--btn);
      color:var(--text);
      font-weight:700;
      border:1px solid rgba(255,255,255,.18);
      cursor:pointer;
      transition:.15s;
    }
    button:hover{background:var(--btnHover); transform:translateY(-1px);}
    .back{
      font-size:14px;
      color:var(--muted);
      text-decoration:none;
      border-bottom:1px dashed rgba(255,255,255,.35);
      padding-bottom:2px;
    }
    .note{
      margin-top:14px;
      font-size:12px;
      color:rgba(255,255,255,.55);
      text-align:center;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Contact Brittney Liggett</h1>
    <p class="sub">Questions, commissions, or collaborations</p>

    <form action="https://formspree.io/f/xvzzpdpq" method="POST">
      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="subject">Subject</label>
      <input id="subject" name="subject">

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <!-- Honeypot -->
      <input type="text" name="_gotcha" style="display:none">

      <!-- Optional: sets Reply-To to the sender (nice for Gmail replies) -->
      <input type="hidden" name="_replyto" value="">

      <div class="actions">
        <button type="submit">Send message</button>
        <a class="back" href="/">Back to home</a>
      </div>

      <div class="note">
        After you send, you’ll see a Formspree confirmation page.
      </div>
    </form>
  </main>

  <script>
    // Helps ensure replies go to the sender (optional)
    const email = document.getElementById("email");
    const reply = document.querySelector('input[name="_replyto"]');
    email.addEventListener("input", () => reply.value = email.value);
  </script>
</body>
</html>
