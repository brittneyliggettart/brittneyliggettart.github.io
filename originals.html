<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Animated ACEOs — Brittney Liggett Art" />
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <title>ACEOs — Brittney Liggett Art</title>

  <style>
    :root{
      --bg1:#0b0f2a;
      --bg2:#1a1150;
      --bg3:#2a0f61;

      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.72);

      --btn:rgba(255,255,255,.09);
      --btnHover:rgba(255,255,255,.14);

      --shadow:0 18px 60px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(1200px 900px at 50% -200px, #4b7bff22 0%, transparent 60%),
        radial-gradient(900px 700px at 10% 10%, #ff4bd822 0%, transparent 55%),
        radial-gradient(900px 700px at 90% 20%, #34d5ff1e 0%, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
      overflow-x:hidden;
    }

    /* Star field */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.85;
      background:
        radial-gradient(6px 6px at 12% 18%, rgba(255,255,255,.28) 40%, transparent 41%),
        radial-gradient(5px 5px at 82% 24%, rgba(255,255,255,.26) 40%, transparent 41%),
        radial-gradient(5px 5px at 60% 80%, rgba(255,255,255,.22) 40%, transparent 41%),
        radial-gradient(4.5px 4.5px at 30% 72%, rgba(255,255,255,.24) 40%, transparent 41%),

        radial-gradient(3.5px 3.5px at 18% 40%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(3.5px 3.5px at 72% 64%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(3.5px 3.5px at 90% 44%, rgba(255,255,255,.50) 40%, transparent 41%),

        radial-gradient(2.2px 2.2px at 8% 10%, rgba(255,255,255,.65) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 16% 28%, rgba(255,255,255,.65) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 24% 54%, rgba(255,255,255,.60) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 34% 18%, rgba(255,255,255,.60) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 42% 40%, rgba(255,255,255,.58) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 48% 72%, rgba(255,255,255,.58) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 56% 12%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 66% 28%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 74% 48%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 78% 70%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 86% 34%, rgba(255,255,255,.55) 40%, transparent 41%),
        radial-gradient(2.2px 2.2px at 90% 62%, rgba(255,255,255,.55) 40%, transparent 41%);
      filter: drop-shadow(0 0 12px rgba(255,255,255,.10));
    }

    .wrap{
      display:flex;
      justify-content:center;
      padding:44px 16px;
    }

    .card{
      width:min(420px,100%);
      background:rgba(255,255,255,.06);
      border-radius:28px;
      padding:28px 18px 22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      border:none;
    }

    .top{
      text-align:left;
      margin-bottom:20px;
    }

    h1{
      text-align:center;
      margin:0;
      font-size:20px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .sub{
      margin:6px 0 0;
      font-size:14px;
      color:var(--muted);
    }

    .sectionTitle{
      text-align:left;
      margin:18px 0 10px;
      font-weight:700;
    }

    .gifWrap{
      margin-top:10px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04);
    }

    .gifWrap img{
      width:100%;
      height:auto;
      display:block;
    }

    .callout{
      text-align:left;
      margin:14px 0 8px;
      color:var(--muted);
      font-size:14px;
    }

        .callout2{
      text-align:left;
      margin:14px 0 8px;
      color:red;
      font-size:14px;
    }

    .smallBtnWrap{
      display:flex;
      justify-content:left;
      margin-top:10px;
    }

    .smallBtn{
      padding:10px 22px;
      border-radius:16px;
      background:var(--btn);
      color:var(--text);
      text-decoration:none;
      font-weight:600;
      border:1px solid rgba(255,255,255,.18);
      transition:.15s;
    }

    .smallBtn:hover{
      background:var(--btnHover);
      transform:translateY(-1px);
    }

    .backLink{
      display:block;
      margin-top:14px;
      text-align:center;
      font-size:14px;
      color:var(--muted);
      text-decoration:none;
      border-bottom:1px dashed rgba(255,255,255,.35);
      width:fit-content;
      margin-left:auto;
      margin-right:auto;
      padding-bottom:2px;
    }

    .foot{
      text-align:center;
      margin-top:18px;
      font-size:12px;
      color:rgba(255,255,255,.55);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <main class="card">
      <header class="top">
      
          <strong>Original Paintings</strong>
          
        
        </p>
      </header>

      <h3 class="sectionTitle">"The Mirage"</h3>
 <p class="callout">
      Acrylic on Canvas<br/>
   20" x 16"<br/>
   2026<br/><br/>
   Currently on display at the <a href="https://www.toledoartistclub.com/2026-birds-bugs-and-blooms">Birds Bugs and Blooms</a> exhibition<br/><br/>
<img style="width:100%;" src="assets/themirage.jpg">
</p>


            <h3 class="sectionTitle">"Where's the Beach?"</h3>
 <p class="callout">
      Acrylic on Canvas<br/>
   20" x 20"<br/>
   2026<br/><br/>
<img style="width:100%;" src="assets/wheresthebeach.jpg">
</p>


      <a class="backLink" href="/">Back to home</a>

      <div class="foot">© <span id="year"></span> Brittney Liggett</div>
    </main>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
